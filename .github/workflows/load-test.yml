# ===== LOAD TESTING WORKFLOW =====
# File: .github/workflows/load-test.yml

name: Performance Testing

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: true
        default: 'https://staging.zamanbank.kz'
      users:
        description: 'Number of users'
        required: true
        default: '100'
      duration:
        description: 'Test duration (seconds)'
        required: true
        default: '300'

jobs:
  load-test:
    name: K6 Load Testing
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Load Test
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          USERS: ${{ github.event.inputs.users }}
          DURATION: ${{ github.event.inputs.duration }}
        run: |
          k6 run --out json=results.json infra/load-tests/load-test.js
      
      - name: Generate HTML Report
        run: |
          k6 run --out html=report.html infra/load-tests/load-test.js
      
      - name: Upload Results
        uses: actions/upload-artifact@v3
        with:
          name: load-test-results
          path: |
            results.json
            report.html
      
      - name: Check Performance Thresholds
        run: |
          # Parse results and check thresholds
          python infra/load-tests/check_thresholds.py results.json