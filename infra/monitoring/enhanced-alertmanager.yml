        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        actions:
          - type: button
            text: 'View Backend Metrics'
            url: 'https://grafana.zamanbank.kz/d/backend'
          - type: button
