          *Description:* {{ .CommonAnnotations.description }}
          *Firing Alerts:* {{ len .Alerts }}
        send_resolved: true
        color: 'good'
        actions:
          - type: button
            text: 'View in Grafana'
            url: 'https://grafana.zamanbank.kz/d/alerts'

  # Database alerts
  - name: 'database-alerts'
