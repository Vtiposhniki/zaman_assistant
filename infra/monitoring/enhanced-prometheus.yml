# Remote read configuration (optional)
# remote_read:
#   - url: "https://prometheus-remote-read-endpoint"
#     basic_auth:
#       username: "username"
#       password: "password"

# Recording rules
recording_rules:
  - name: "zaman_backend.rules"
    rules:
      - record: zaman_backend:request_rate
        expr: rate(http_requests_total{job="zaman-backend"}[5m])
      
      - record: zaman_backend:error_rate
        expr: rate(http_requests_total{job="zaman-backend",status=~"5.."}[5m])
      
      - record: zaman_backend:response_time_p95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="zaman-backend"}[5m]))
      
      - record: zaman_backend:response_time_p99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job="zaman-backend"}[5m]))
      
      - record: zaman_backend:active_connections
        expr: sum(up{job="zaman-backend"})
      
      - record: zaman_backend:cpu_usage
        expr: rate(container_cpu_usage_seconds_total{container="backend"}[5m])
      
      - record: zaman_backend:memory_usage
        expr: container_memory_usage_bytes{container="backend"}
      
      - record: zaman_backend:memory_limit
        expr: container_spec_memory_limit_bytes{container="backend"}
      
      - record: zaman_backend:memory_utilization
        expr: container_memory_usage_bytes{container="backend"} / container_spec_memory_limit_bytes{container="backend"}

