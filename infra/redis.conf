# Redis Configuration for Zaman Assistant Goals Service
# Настройки персистентности и производительности

# ===== PERSISTENCE SETTINGS =====
# Включение AOF (Append Only File) для максимальной надежности
appendonly yes
appendfilename "goals.aof"

# Настройки AOF
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots для дополнительной защиты
save 900 1    # Сохранить если изменился хотя бы 1 ключ за 900 секунд
save 300 10   # Сохранить если изменилось хотя бы 10 ключей за 300 секунд
save 60 10000 # Сохранить если изменилось хотя бы 10000 ключей за 60 секунд

# Сжатие RDB
rdbcompression yes
rdbchecksum yes
dbfilename "goals.rdb"

# ===== MEMORY MANAGEMENT =====
# Максимальное использование памяти (256MB)
maxmemory 256mb

# Политика вытеснения - удалять наименее используемые ключи
maxmemory-policy allkeys-lru

# ===== NETWORK SETTINGS =====
# Привязка к всем интерфейсам (для Docker)
bind 0.0.0.0

# Порт
port 6379

# Таймауты
timeout 300
tcp-keepalive 300

# ===== LOGGING =====
# Уровень логирования
loglevel notice

# Лог файл
logfile ""

# ===== SECURITY =====
# Отключение опасных команд в production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""

# ===== PERFORMANCE =====
# Количество баз данных
databases 16

# Настройки для высоконагруженных приложений
tcp-backlog 511
hz 10

# ===== GOALS SERVICE SPECIFIC =====
# Настройки для работы с целями
# Хранение целей в Hash структурах
# Pub/Sub для real-time обновлений
# Автоматическое истечение неактивных ключей (опционально)
# expire-goals-after 2592000  # 30 дней (если нужно)

# ===== MONITORING =====
# Включение мониторинга команд
# monitor

# ===== CLIENT SETTINGS =====
# Максимальное количество клиентов
maxclients 10000

# Размер буфера для клиентских команд
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
