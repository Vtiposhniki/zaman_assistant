version: '3.8'

# ===== ZAMAN ASSISTANT DOCKER COMPOSE =====
# Windows-совместимая версия
# Использование: docker-compose up -d

services:
  # ===== FASTAPI BACKEND =====
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: zaman-backend
    
    environment:
      # Загрузка из .env файла
      - OPENAI_HUB_KEY=${OPENAI_HUB_KEY}
      - OPENAI_HUB_URL=${OPENAI_HUB_URL:-https://openai-hub.neuraldeep.tech}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-supersecret}
      - DATABASE_URL=postgresql://zaman:zamanpass@postgres:5432/zaman_db
      - MOCK_MODE=${MOCK_MODE:-true}
      - DEBUG=${DEBUG:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-200}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-3600}
      - EMBEDDINGS_PATH=/app/data/product_embeddings.pkl
    
    volumes:
      # Монтирование кода для hot-reload (только для dev)
      - ../backend:/app/backend:rw
      # Persistent данные
      - zaman-data:/app/data
      - zaman-logs:/app/logs
    
    ports:
      - "8000:8000"
    
    depends_on:
      postgres:
        condition: service_healthy
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import httpx; httpx.get(\"http://localhost:8000/health\", timeout=5)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - zaman-network

  # ===== POSTGRESQL DATABASE =====
  postgres:
    image: postgres:16-alpine
    container_name: zaman-postgres
    
    environment:
      - POSTGRES_DB=zaman_db
      - POSTGRES_USER=zaman
      - POSTGRES_PASSWORD=zamanpass
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    ports:
      - "5432:5432"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaman -d zaman_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - zaman-network

  # ===== REDIS CACHE (Optional - profile: full) =====
  redis:
    image: redis:7-alpine
    container_name: zaman-redis
    
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    
    volumes:
      - redis-data:/data
    
    ports:
      - "6379:6379"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    
    networks:
      - zaman-network
    
    profiles:
      - full
      - production

  # ===== NGINX REVERSE PROXY (Optional - profile: production) =====
  nginx:
    image: nginx:alpine
    container_name: zaman-nginx
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    
    ports:
      - "80:80"
      - "443:443"
    
    depends_on:
      - backend
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - zaman-network
    
    profiles:
      - production

# ===== PERSISTENT VOLUMES =====
volumes:
  postgres-data:
    driver: local
  zaman-data:
    driver: local
  zaman-logs:
    driver: local
  redis-data:
    driver: local

# ===== NETWORK =====
networks:
  zaman-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16