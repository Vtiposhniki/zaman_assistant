version: '3.8'

# ===== ZAMAN ASSISTANT DOCKER COMPOSE (ИСПРАВЛЕНО) =====

services:
  # ===== FASTAPI BACKEND =====
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: zaman-backend
    
    # ✅ ИСПРАВЛЕНО: Читаем .env файл
    env_file:
      - ..\backend\.env  # Создайте infra/.env с вашими настройками
    
    environment:
      # Переопределяем только специфичные для Docker параметры
      - DATABASE_URL=sqlite:///./zaman_assistant.db
      - EMBEDDINGS_PATH=/app/data/product_embeddings.pkl
    
    volumes:
      # Persistent данные
      - zaman-data:/app/data
      - zaman-logs:/app/logs
      # SQLite файл
      - zaman-db:/app
    
    ports:
      - "8000:8000"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    networks:
      - zaman-network

  # ===== POSTGRESQL (опционально для production) =====
  postgres:
    image: postgres:16-alpine
    container_name: zaman-postgres
    
    environment:
      - POSTGRES_DB=zaman_db
      - POSTGRES_USER=zaman
      - POSTGRES_PASSWORD=zamanpass
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    ports:
      - "5432:5432"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaman -d zaman_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    
    networks:
      - zaman-network
    
    profiles:
      - production

  # ===== REDIS CACHE (Optional) =====
  redis:
    image: redis:7-alpine
    container_name: zaman-redis
    
    # Использование конфигурационного файла
    command: redis-server /usr/local/etc/redis/redis.conf
    
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    
    ports:
      - "6379:6379"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    
    networks:
      - zaman-network
    
    profiles:
      - full
      - production

# ===== PERSISTENT VOLUMES =====
volumes:
  zaman-db:
    driver: local
  zaman-data:
    driver: local
  zaman-logs:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

# ===== NETWORK =====
networks:
  zaman-network:
    driver: bridge