version: '3.8'

# ===== ZAMAN ASSISTANT DOCKER COMPOSE (WINDOWS FIXED) =====

services:
  # ===== POSTGRESQL DATABASE (запускается первым) =====
  postgres:
    image: postgres:16-alpine
    container_name: zaman-postgres
    
    environment:
      - POSTGRES_DB=zaman_db
      - POSTGRES_USER=zaman
      - POSTGRES_PASSWORD=zamanpass
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # init.sql удален - БД инициализируется в коде
    
    ports:
      - "5432:5432"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaman -d zaman_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    
    networks:
      - zaman-network

  # ===== FASTAPI BACKEND =====
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: zaman-backend
    
    environment:
      # ✅ ИСПРАВЛЕНО: Правильный DATABASE_URL
      - DATABASE_URL=postgresql://zaman:zamanpass@postgres:5432/zaman_db
      - OPENAI_HUB_KEY=${OPENAI_HUB_KEY:-}
      - OPENAI_HUB_URL=${OPENAI_HUB_URL:-https://openai-hub.neuraldeep.tech}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-supersecret}
      - MOCK_MODE=${MOCK_MODE:-true}
      - DEBUG=${DEBUG:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-200}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-3600}
      - EMBEDDINGS_PATH=/app/data/product_embeddings.pkl
    
    volumes:
      # ✅ ИСПРАВЛЕНО: Закомментирован volume для production
      # Раскомментируйте только для development с hot-reload
      # - ../backend:/app/backend:rw
      
      # Persistent данные
      - zaman-data:/app/data
      - zaman-logs:/app/logs
    
    ports:
      - "8000:8000"
    
    depends_on:
      postgres:
        condition: service_healthy
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    networks:
      - zaman-network

  # ===== REDIS CACHE (Optional - profile: full) =====
  redis:
    image: redis:7-alpine
    container_name: zaman-redis
    
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    
    volumes:
      - redis-data:/data
    
    ports:
      - "6379:6379"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    
    networks:
      - zaman-network
    
    profiles:
      - full
      - production

# ===== PERSISTENT VOLUMES =====
volumes:
  postgres-data:
    driver: local
  zaman-data:
    driver: local
  zaman-logs:
    driver: local
  redis-data:
    driver: local

# ===== NETWORK =====
networks:
  zaman-network:
    driver: bridge